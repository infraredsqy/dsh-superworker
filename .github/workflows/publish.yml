name: Publish Package

# Runs in exactly two cases: a v* tag is pushed (a normal release), or a person/agent triggers it by hand
# (first-time verification, a re-release). An ordinary push does not touch it — this workflow publishes,
# so the less it runs the better.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Trusted publishing (OIDC) needs just these two: the power to issue an OIDC token, and the power to read
# the repository. No token is handed over here — the whole point of this route is that no long-lived secret
# exists.
permissions:
  id-token: write
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - uses: actions/setup-node@v7
        with:
          node-version: '26' # the same as this machine, so the published product is the one verified here
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # a release build uses no cache: the official line

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: npm test

      - name: Style check
        run: node tools/css-check.mjs

      # The build chain's one true copy is the prepack in package.json; this step only calls npm publish,
      # so what gets installed is the prebuilt product
      - name: Publish
        run: npm publish